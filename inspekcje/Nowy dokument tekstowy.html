<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Auroravia</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }
        header {
            background-color: #2c3e50;
            color: #fff;
            padding: 20px;
            text-align: center;
        }
        nav {
            background-color: #34495e;
            padding: 10px;
            text-align: center;
        }
        nav a {
            color: #fff;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
        }
        nav a:hover {
            text-decoration: underline;
        }
        section {
            padding: 20px;
            margin: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
        }
        footer {
            background-color: #2c3e50;
            color: #fff;
            text-align: center;
            padding: 10px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
        h1, h2 {
            color: #2c3e50;
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
        }
        .section-image {
            width: 150px;
            margin-right: 20px;
        }
        .center-image {
            display: block;
            margin: 20px auto;
            max-width: 100%;
            width: 100%;
            height: auto;
        }
        .image-container {
            position: relative;
            text-align: center;
            margin: 20px 0;
        }
        .image-title {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 8px;
        }
        .image-description {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 16px;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to Auroravia</h1>
        <p>The Land of Eternal Dawn</p>
    </header>

    <nav>
        <a href="about.html">About</a>
        <a href="geography.html">Geography</a>
        <a href="culture.html">Culture</a>
        <a href="tourism.html">Tourism</a>
        <a href="contact.html">Contact</a>
    </nav>

    <div class="image-container">
        <a href="tourism.html">
            <img src="images/Inspektor.jpg" alt="Auroravia Center Image" class="center-image">
        </a>
        <div class="image-title">Explore Auroravia</div>
        <div class="image-description">Discover the beauty of the Land of Eternal Dawn</div>
    </div>

    <footer>
        <p>&copy; 2023 Auroravia. All rights reserved.</p>
    </footer>

</body>
</html>
